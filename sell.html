<body>

<header>

<nav>

<section class="form-section">

<h1>Sell USDT</h1>

<p class="warning">
Orders below 100 USDT will not be accepted
</p>

<form id="sellForm">

<input
type="number"
placeholder="USDT Amount"
id="amount"
required
>

<input
type="text"
placeholder="Transaction Hash (TxID)"
required
>

<input
type="file"
required
>

<input
type="text"
placeholder="Account Holder Name"
required
>

<input
type="text"
placeholder="Bank Name"
required
>

<input
type="text"
placeholder="Account Number"
required
>

<input
type="text"
placeholder="IFSC Code"
required
>

<input
type="text"
placeholder="UPI ID (Optional)"
>

<button type="submit">
Submit Order
</button>

</form>

</section>
